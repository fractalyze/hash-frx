# hash-frx builds via Bazel (MODULE.bazel) and is consumed two ways: `sig-frx`
# takes it as a bzlmod module (`bazel_dep` + `git_override`), and `zorch` takes
# it as a wheel from its pip lock. The packaging tables below serve the second —
# a bazel-level dependency would give a pip-locked consumer two dependency
# mechanisms for one library.
#
# The rest configures the tools that are not Bazel: pytest, which runs the
# `*_test.py` modules outside the bazel graph, and mypy, which enforces the
# full-annotation convention.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hash-frx"
dynamic = ["version"]
description = "hash-frx — FRX-native hash primitives (Poseidon, Poseidon2, SHA-256, sponge and compression constructions), each lowering to a single fused kernel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The hash-frx Authors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
]
# Only what the shipped tree imports. `absl-py` and `zk-dtypes` are in
# requirements.in for the Bazel test graph but appear nowhere outside `testing/`,
# so declaring them would make every consumer install a test dependency. frxlib
# is not listed because frx already requires it.
#
# The `frx` bound is a toolchain floor, and violating it is silent: below it the
# package still installs, imports and hashes correctly while routing none of its
# kernels, because a marker the compiler does not accept inlines back to its
# decomposition. release.yml checks a compiled module against the public
# dependency closure before any release ships.
#
# The GPU plugins (frx-cuda12-*) stay undeclared: they are an install-time
# platform choice, offered through frx's own `cuda12` extra.
#
# `blake3` is declared because the shipped tree imports it: the `HostBlake3*` rows
# in `hash_frx/blake3/byte_hashes.py` need a native BLAKE3 the way the other host
# rows need `hashlib`, and the standard library has none. It ships prebuilt wheels
# for every platform this package supports, so it costs a consumer no toolchain.
dependencies = [
    "numpy",
    # Floor = the first wheel whose Grøstl-256 emitter accepts the RUNTIME-LENGTH
    # operand form (fractalyze/xla#599, merged as PR #600), which
    # `grostl.grostl256_bytes` now emits and has no static-tail form to fall
    # back to.
    #
    # This floor is the first here that guards against being SLOWER rather than
    # against being wrong or un-fused. Below it the marker is declined and the
    # digest inlines a decomposition that derives its block count from runtime
    # data — so it speculates every block the buffer could hold, where the
    # static-tail form it replaced compressed only the blocks the message
    # occupied. Right bytes either way; the interval this floor closes is one
    # where the package would ship a regression, which is why the swap and this
    # line are one change.
    #
    # It subsumes the dedicated Grøstl-256 CPU emitter (fractalyze/xla#591, PR
    # #593), below which the marker is declined outright — right bytes, and a
    # fusion count two orders of magnitude off the routed one, for the reason
    # `grostl._DEDICATED_EMITTER_AVAILABLE` states.
    #
    # Neither Grøstl floor is silent.
    # `grostl.testing.grostl_test.Grostl256MarkerRecognizedTest` reads the
    # COMPILED module on the cpu leg — the leg `grostl._EMITTER_BACKENDS`
    # names — and fails below it. The floor still states the requirement; that
    # test is what refuses to ship it unmet.
    #
    # Verified against the wheel rather than inferred from its version: the
    # bump PR that produced it names the jax commit that triggered it
    # (`jax@9a2b14a41c47`), whose `third_party/xla/revision.bzl` pins
    # `2b7cf3e55bfa…` — the xla commit PR #600 merged, closing #599. The version
    # suffix cannot settle this on its own; a bump PR is opened carrying an
    # older commit and updated in place.
    #
    # It subsumes the runtime-length SHA-256 digest ABI floor: the first wheel
    # where that ABI is SAFE under the `hash_frx.digest.sha256_bytes` name it
    # travels as. Three things had to be in the wheel, and they landed
    # separately — the CPU emitter (fractalyze/xla#575), acceptance of the
    # runtime-length ABI under this name (xla#581), and the GPU emitter plus
    # its compiler gate (xla#582, merged as PR #585).
    #
    # All three are load-bearing for `digest` itself, which routes the length
    # ABI on every backend in `_BYTES_EMITTER_BACKENDS` — GPU included. On a
    # wheel without the GPU emitter, a GPU caller gets the name recognized and
    # the operands DECLINED: right bytes, and the decomposition it falls back to
    # speculates every block the buffer could hold, so it is slower than the
    # blocks form rather than merely un-fused. `sha256_bytes` has no routing
    # gate of its own, so a direct caller — this package's own test suite
    # included — hits the same decline wherever it runs. That floor was
    # invisible in both directions, because nothing failed.
    #
    # Both of these buy back performance, where the ones below them bought
    # back correctness.
    #
    # They subsume, in turn, the raw-bytes digest marker
    # (`hash_frx.digest.sha256_bytes`, fractalyze/xla#561): the wheel before
    # its floor recognized that marker but lacked its kernel reuse-key arm, so
    # two different-length digests in ONE compiled program shared a kernel and
    # the second returned wrong bytes on GPU (fractalyze/xla#562), and with
    # it the kind-namespaced marker spellings
    # (`hash_frx.perm.*` / `.compress.*` / `.digest.*`, fractalyze/xla#539),
    # the vmapped-sponge rank collapse (fractalyze/xla#549), the
    # Keccak-emitter SAFETY wheel (the wheel that first shipped the dedicated
    # Keccak emitters fused a producer into the permutation's custom fusion
    # and dropped it from the kernel, so an incremental SHAKE aborted or
    # returned a wrong digest with no error — fractalyze/xla#517), and before
    # that the composite-constant lifting ABI every dedicated emitter depends
    # on.
    #
    # The `!=` excludes the one version no lower bound can reach: PEP 440 sorts
    # a final release above ALL of its own pre-releases, so `0.10.2` — released
    # before any of this — sorts above the dev build named as the floor and
    # would otherwise satisfy it. Naming a later stable instead fails the other
    # way, since the nightly line resumes below it (`0.10.3.dev...` < `0.10.3`).
    "frx>=0.10.2.dev20260826215637,!=0.10.2",
]

[project.urls]
Repository = "https://github.com/fractalyze/hash-frx"

[tool.setuptools.dynamic]
version = { attr = "hash_frx.__version__" }

# Ship the runtime tree only. Every `testing/` package is dropped: they hold the
# test-only assertions and the reference fixtures, which name a concrete
# parameterization (`poseidon2/testing/koalabear16.py`) and are deliberately not
# package API — a consumer needing a named instance owns it.
[tool.setuptools.packages.find]
where = ["."]
include = ["hash_frx*"]
exclude = [
    "hash_frx.testing",
    "hash_frx.testing.*",
    "hash_frx.*.testing",
    "hash_frx.*.testing.*",
]

[tool.pytest.ini_options]
testpaths = ["hash_frx"]
python_files = ["*_test.py", "test_*.py"]

# Every def carries full type annotations (docs/reference/conventions.md); mypy's
# disallow_untyped_defs is what enforces it, and it is also what makes the
# seam-conformance pins (`if TYPE_CHECKING: _: type[Permutation] = ...`) bite —
# without it those lines compile and prove nothing.
[tool.mypy]
python_version = "3.11"
files = ["hash_frx"]
mypy_path = "."
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Untyped (or, for frx, statically unresolvable) third parties:
# frx ships .pyi stubs that do not parse under mypy, so its types are unusable
# here — `frx.Array` collapses to Any. zk_dtypes ships no py.typed; absl stubs
# only part of its surface. disallow_untyped_defs still enforces our own
# annotations regardless, which is where the value is.
[[tool.mypy.overrides]]
module = ["frx.*", "frxlib.*", "zk_dtypes.*", "absl.*"]
ignore_missing_imports = true

# hash-frx builds via Bazel (MODULE.bazel) and is consumed two ways: `sig-frx`
# takes it as a bzlmod module (`bazel_dep` + `git_override`), and `zorch` takes
# it as a wheel from its pip lock. The packaging tables below serve the second —
# a bazel-level dependency would give a pip-locked consumer two dependency
# mechanisms for one library.
#
# The rest configures the tools that are not Bazel: pytest, which runs the
# `*_test.py` modules outside the bazel graph, and mypy, which enforces the
# full-annotation convention.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hash-frx"
dynamic = ["version"]
description = "hash-frx — FRX-native hash primitives (Poseidon, Poseidon2, SHA-256, sponge and compression constructions), each lowering to a single fused kernel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The hash-frx Authors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
]
# Only what the shipped tree imports. `absl-py` and `zk-dtypes` are in
# requirements.in for the Bazel test graph but appear nowhere outside `testing/`,
# so declaring them would make every consumer install a test dependency. frxlib
# is not listed because frx already requires it.
#
# The `frx` bound is a toolchain floor, and violating it is silent: below it the
# package still installs, imports and hashes correctly while routing none of its
# kernels, because a marker the compiler does not accept inlines back to its
# decomposition. release.yml checks a compiled module against the public
# dependency closure before any release ships.
#
# The GPU plugins (frx-cuda12-*) stay undeclared: they are an install-time
# platform choice, offered through frx's own `cuda12` extra.
#
# `blake3` is declared because the shipped tree imports it: the `HostBlake3*` rows
# in `hash_frx/blake3/byte_hashes.py` need a native BLAKE3 the way the other host
# rows need `hashlib`, and the standard library has none. It ships prebuilt wheels
# for every platform this package supports, so it costs a consumer no toolchain.
dependencies = [
    "numpy",
    "blake3",
    # Floor = the first wheel where closed-over composite constants stay inline
    # (fractalyze/jax#218); an older frx lifts the captured matrices to leading
    # operands and breaks every dedicated emitter ABI.
    #
    # The `!=` excludes the one version no lower bound can reach: PEP 440 sorts
    # a final release above ALL of its own pre-releases, so `0.10.1` — which
    # predates both that fix and the `hash_frx.*` marker rename — sorts above
    # the dev build named as the floor. Naming a later stable instead fails the
    # other way, since the nightly line resumes below it (`0.10.2.dev...` <
    # `0.10.2`).
    "frx>=0.10.1.dev20260812040018,!=0.10.1",
]

[project.urls]
Repository = "https://github.com/fractalyze/hash-frx"

[tool.setuptools.dynamic]
version = { attr = "hash_frx.__version__" }

# Ship the runtime tree only. Every `testing/` package is dropped: they hold the
# test-only assertions and the reference fixtures, which name a concrete
# parameterization (`poseidon2/testing/koalabear16.py`) and are deliberately not
# package API — a consumer needing a named instance owns it.
[tool.setuptools.packages.find]
where = ["."]
include = ["hash_frx*"]
exclude = [
    "hash_frx.testing",
    "hash_frx.testing.*",
    "hash_frx.*.testing",
    "hash_frx.*.testing.*",
]

[tool.pytest.ini_options]
testpaths = ["hash_frx"]
python_files = ["*_test.py", "test_*.py"]

# Every def carries full type annotations (docs/reference/conventions.md); mypy's
# disallow_untyped_defs is what enforces it, and it is also what makes the
# seam-conformance pins (`if TYPE_CHECKING: _: type[Permutation] = ...`) bite —
# without it those lines compile and prove nothing.
[tool.mypy]
python_version = "3.11"
files = ["hash_frx"]
mypy_path = "."
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Untyped (or, for frx, statically unresolvable) third parties:
# frx ships .pyi stubs that do not parse under mypy, so its types are unusable
# here — `frx.Array` collapses to Any. zk_dtypes ships no py.typed; absl stubs
# only part of its surface. disallow_untyped_defs still enforces our own
# annotations regardless, which is where the value is.
[[tool.mypy.overrides]]
module = ["frx.*", "frxlib.*", "zk_dtypes.*", "absl.*"]
ignore_missing_imports = true

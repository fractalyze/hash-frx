name: CI

permissions: read-all

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for PRs (same head branch), but never cancel pushes
# to main so that every merge gets a full CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Two legs, and both are required. The CPU leg is what checks the primitives
  # against their published vectors; the GPU leg is what makes the fusion
  # markers mean anything, because a marker that stops being recognized still
  # produces the right bytes on CPU. Runners are labelled by capability, not by
  # role — a CPU box is `[self-hosted, cpu]` and a GPU box is
  # `[self-hosted, gpu]` — so each leg lands on a box that advertises what it
  # needs.
  #
  # The matrix is static: both legs run on every pull request. Gating the GPU
  # leg on a repo variable would turn a required check into one that never
  # reports, which leaves pull requests pending forever rather than red.
  build-and-test:
    # Explicit name; else GitHub appends every matrix value (incl. the long
    # --config=remote + cert-path flags) to the auto-generated job name.
    name: build-and-test (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The CPU leg executes on the Buildbarn pool (`--config=remote`, see
          # //.bazelrc.rbe); the mTLS client material is machine-local, so the
          # paths point at the runner's own /etc/rbe-certs.
          - backend: cpu
            runs_on: [self-hosted, cpu]
            platforms: cpu
            flags: >-
              --config=remote
              --tls_certificate=/etc/rbe-certs/ca.pem
              --tls_client_certificate=/etc/rbe-certs/client.pem
              --tls_client_key=/etc/rbe-certs/client.key
          # The pool is CPU-only, so the GPU leg executes locally on the runner
          # and passes no remote flags. `cuda` is strict — no cpu fallback — so
          # a green leg really did run on the device. Preallocation is off
          # because bazel runs the test actions concurrently against that one
          # device, and each process would otherwise claim most of its memory.
          - backend: gpu
            runs_on: [self-hosted, gpu]
            platforms: cuda
            flags: --test_env=XLA_PYTHON_CLIENT_PREALLOCATE=false
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      # The pinned plugin is `frx-cuda12-*` and version-checks the CUDA runtime
      # at import, so on a box whose system CUDA is 13 the `cuda` backend never
      # registers and every device-touching target dies at init. Reading that
      # requirement as "a `gpu` box carries a system CUDA 12" puts the leg at
      # the mercy of machine state the tree cannot see: a leg that passes or
      # fails on which runner picked it up is not a gate. So the leg brings its
      # own runtime instead, and a `gpu` box needs only a driver.
      #
      # `with-cuda` is exactly the set of `nvidia-*-cu12` wheels the plugin
      # resolves by soname. pip is asked for the cp311 wheels rather than
      # whatever the box's own python resolves, because cp311 is the
      # interpreter bazel runs the tests under, so the versions staged here are
      # the ones the pinned plugin declares. Only the libraries are used —
      # bazel supplies the plugin itself from the lock.
      #
      # The stash is keyed by the pin and its siblings are pruned, so each pin
      # downloads once per box and the dev-release cadence does not accumulate
      # copies of several GB.
      - name: Stage the CUDA 12 runtime the plugin loads
        if: ${{ matrix.backend == 'gpu' }}
        run: |
          set -euo pipefail
          pin=$(grep -oP '(?<=^frx-cuda12-plugin==).*' requirements.in)
          root="$HOME/.cache/hash-frx/cuda12"
          nv="$root/$pin/nvidia"
          if [ ! -d "$nv" ]; then
            # Staged aside and renamed, so an interrupted download leaves no
            # half-populated stash for the next run to trust.
            mkdir -p "$root"
            staging=$(mktemp -d "$root/.staging.XXXXXX")
            python3 -m pip install --disable-pip-version-check --no-cache-dir \
              --target "$staging" \
              --extra-index-url https://fractalyze.github.io/pypi/simple/ \
              --only-binary=:all: --python-version 3.11 --implementation cp \
              --abi cp311 --platform manylinux_2_27_x86_64 \
              --platform manylinux2014_x86_64 \
              "frx-cuda12-plugin[with-cuda]==$pin"
            mv "$staging" "$root/$pin"
          fi
          find "$root" -mindepth 1 -maxdepth 1 ! -name "$pin" -exec rm -rf {} +
          libs=$(find "$nv" -mindepth 2 -maxdepth 2 -type d -name lib | sort |
                   paste -sd:)
          # `ptxas` is named separately because it ships under `cuda_nvcc/bin`
          # rather than any `lib` directory, so `LD_LIBRARY_PATH` does not reach
          # it. Without the flag XLA takes the system's `ptxas` — the wrong
          # major on such a box, and found rather than reported missing.
          nvcc="--xla_gpu_cuda_data_dir=$nv/cuda_nvcc"
          echo "CUDA12_FLAGS=--test_env=LD_LIBRARY_PATH=$libs --test_env=XLA_FLAGS=$nvcc" \
            >> "$GITHUB_ENV"

      # No setup-bazel: it clobbers the box's ~/.bazelrc, and the self-hosted
      # runners already persist bazel and its caches. `.bazelrc.ci` is passed
      # explicitly because it is not auto-imported — it drops the `local_only`
      # tests that CI's published frx wheel cannot run.
      - name: Run bazel test
        run: |
          set -euo pipefail
          # CUDA12_FLAGS is two flags and is meant to split into two words;
          # it is empty on the CPU leg, whose staging step does not run.
          # shellcheck disable=SC2086
          bazel --bazelrc=.bazelrc.ci test ${{ matrix.flags }} ${CUDA12_FLAGS:-} \
            --test_env=FRX_PLATFORMS=${{ matrix.platforms }} -- //...

      # Capture the runner-local test.log a failed test leaves behind — the CI
      # stream only carries the FAIL summary, not the test's own output.
      - name: Upload bazel test logs
        if: ${{ failure() }}
        uses: fractalyze/.github/.github/actions/upload-bazel-testlogs@main
        with:
          name: bazel-test-logs-${{ matrix.backend }}

  # GitHub-hosted, so lint never queues behind the contended self-hosted pool.
  # `--all-files` rather than the pull request's range: the tree is small enough
  # that a full pass is cheap, and it also catches a file that reached main
  # before the hook covering it existed.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files
